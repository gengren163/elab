name: Sync eLabFTW images to ACR

# 搬运工：GitHub Actions 在海外直连 Docker Hub，把镜像推到阿里云 ACR 公网域名；
# 阿里云 ECS 只从 ACR 的 VPC 内网域名拉取，全程不接触 Docker Hub。
#
# 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 里配置：
#   ACR_REGISTRY       ACR 公网域名，例 registry.cn-hangzhou.aliyuncs.com
#                      （必须是公网域名；GitHub 访问不到 registry-vpc 内网域名）
#   ACR_NAMESPACE      命名空间，例 elabmirror
#   ACR_USERNAME       阿里云账号名
#   ACR_PASSWORD       ACR「访问凭证」里设置的固定密码（不是阿里云登录密码）
#   DOCKERHUB_USERNAME 可选，避免 GitHub 共享出口 IP 撞上 Docker Hub 匿名限流
#   DOCKERHUB_TOKEN    可选，Docker Hub access token
#
# 前置：在 ACR 控制台先手动创建两个镜像仓库 elabimg 和 mysql（个人版不会在 push 时自动建仓）。
# 提示：ACR 仓库设为「公开」时 ECS 无需 docker login；设为私有需在 ECS 上也 login。
# 个人版私有仓库有 500MB 配额，建议设公开并定期清理旧 tag。
# 首次使用请先运行 server/switch-to-acr.sh，之后每次升级只需本工作流 + server/elab-update.sh。
# 若 ACR 报「digest 无法保留」，可去掉 --preserve-digests 重试，但必须保留下方的 digest 校验。

on:
  workflow_dispatch:
    inputs:
      elabftw_version:
        description: 'eLabFTW 版本号，例 6.1.0；留空自动取 GitHub 最新 release'
        required: false
        default: ''
      mysql_version:
        description: 'MySQL tag，必须与 /etc/elabftw.yml 中保持一致'
        required: true
        default: '8.4'
      elabimg_repo:
        description: '上游 elabimg 仓库'
        required: true
        default: 'elabftw/elabimg'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    steps:
      - name: 安装 skopeo / jq
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo jq
          fi
          skopeo --version

      - name: 解析 eLabFTW 版本
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.elabftw_version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
          else
            version=$(gh api repos/elabftw/elabftw/releases/latest --jq '.tag_name')
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]]; then
            echo "版本号格式异常: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved eLabFTW version: $version"

      - name: 登录 registry
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_USER: ${{ secrets.ACR_USERNAME }}
          ACR_PASS: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            printf '%s' "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin docker.io
          fi
          printf '%s' "$ACR_PASS" | docker login --username "$ACR_USER" --password-stdin "$ACR_REGISTRY"
          echo "Logged in to $ACR_REGISTRY"

      - name: 复制镜像并校验 digest
        env:
          VERSION: ${{ steps.ver.outputs.value }}
          MYSQL_VERSION: ${{ inputs.mysql_version }}
          ELABIMG_REPO: ${{ inputs.elabimg_repo }}
        run: |
          set -euo pipefail
          AUTH="$HOME/.docker/config.json"
          SRC_ELAB="docker://docker.io/${ELABIMG_REPO}:${VERSION}"
          DST_ELAB="docker://${ACR_REGISTRY}/${ACR_NAMESPACE}/elabimg:${VERSION}"
          SRC_MYSQL="docker://docker.io/library/mysql:${MYSQL_VERSION}"
          DST_MYSQL="docker://${ACR_REGISTRY}/${ACR_NAMESPACE}/mysql:${MYSQL_VERSION}"

          echo "==> $SRC_ELAB -> $DST_ELAB"
          skopeo copy --all --preserve-digests --retry-times 3 --authfile "$AUTH" "$SRC_ELAB" "$DST_ELAB"
          echo "==> $SRC_MYSQL -> $DST_MYSQL"
          skopeo copy --all --preserve-digests --retry-times 3 --authfile "$AUTH" "$SRC_MYSQL" "$DST_MYSQL"

          echo "=== digest 校验 ==="
          for pair in "${SRC_ELAB}|${DST_ELAB}" "${SRC_MYSQL}|${DST_MYSQL}"; do
            src="${pair%%|*}"; dst="${pair##*|}"
            s=$(skopeo inspect --authfile "$AUTH" "$src" | jq -r '.Digest')
            d=$(skopeo inspect --authfile "$AUTH" "$dst" | jq -r '.Digest')
            echo "$src  $s"
            echo "$dst  $d"
            if [ -z "$d" ] || [ "$d" = "null" ] || [ "$s" != "$d" ]; then
              echo "ERROR: digest 不一致，镜像可能被改写，请勿上线" >&2
              exit 1
            fi
          done
          echo "ELABFTW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 输出下一步
        run: |
          echo "同步完成。ECS 上执行："
          echo "  ./server/switch-to-acr.sh <命名空间> ${ELABFTW_VERSION} <地域>"
          echo "  ./server/elab-update.sh ${ELABFTW_VERSION}"
